{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-3">Login</h3>
        <form method="post" class="card p-3 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Login As</label>
                <select name="login_as" class="form-select" required>
                    <option value="user" selected>User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input id="loginPassword" name="password" type="password" class="form-control" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggleLoginPassword">Show</button>
                </div>
            </div>
            <button class="btn btn-primary">Login</button>
            <p class="mt-3 mb-0">New user? <a href="{{ url_for('auth.register') }}">Register here</a>.</p>
        </form>
    </div>
</div>
<script>
(function () {
    const passwordInput = document.getElementById("loginPassword");
    const toggleButton = document.getElementById("toggleLoginPassword");

    if (!passwordInput || !toggleButton) {
        return;
    }

    toggleButton.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        toggleButton.textContent = isHidden ? "Hide" : "Show";
    });
})();
</script>
{% endblock %}
